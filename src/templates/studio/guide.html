{% extends "base.html" %}
{% block title %}{{ _('Studiamo Markdown guide') }}{% endblock %}

{% block content %}
<div class="reader guide grid-cols-[minmax(0,1fr)_240px] max-[800px]:grid-cols-1">
<article><p class="crumbs"><a href="{{ url_for('studio.index') }}">{{ _('STUDIO') }}</a> {{ _('/ GUIDE') }}</p><div class="prose">{{ page.html|safe }}</div></article>
<nav class="side" aria-label="{{ _('On this page') }}"><h2>{{ _('ON THIS PAGE') }}</h2><ul>{% for id, title in page.toc %}<li><a href="#{{ id }}">{{ title }}</a></li>{% endfor %}</ul></nav>
</div>
<script src="{{ url_for('static', filename='js/smd.js') }}"></script>
{% endblock %}
