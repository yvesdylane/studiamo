{# avatar(user, size): the profile photo, or the initials on a hexagon in the user's colour #}
{% macro avatar(user, size=64, label=true) %}
{% if user.avatar_url %}<img class="avatar-img" src="{{ user.avatar_url }}" alt="{{ (user.player_name or user.name) if label else '' }}" width="{{ size }}" height="{{ size }}" style="width:{{ size }}px;height:{{ size }}px">
{% else %}<span class="hex avatar-hex" style="width:{{ size }}px;height:{{ size }}px;font-size:{{ (size * 0.36)|round|int }}px;background:{{ user.accent_color or 'var(--purple)' }}"{% if label %} role="img" aria-label="{{ user.player_name or user.name }}"{% else %} aria-hidden="true"{% endif %}>{{ user.initials }}</span>{% endif %}
{% endmacro %}
